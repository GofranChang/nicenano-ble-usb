# Compatibility diagnostics: no external 32.768 kHz crystal required.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
# USB HID remains present; a second USB interface exposes diagnostic logs.
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USB_DEVICE_PRODUCT="nice!nano HID Bridge v8 Web Console"
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_USB_DEVICE_PID=0x0101
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=2048

# Preserve complete control responses during device-list bursts.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
